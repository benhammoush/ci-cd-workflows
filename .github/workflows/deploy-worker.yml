# Called by Worker APIs: ci.yml delivers dev; deploy-production.yml releases production.
# Delegates tested-bundle deployment to deploy.yml using named Cloudflare credentials.
name: Deploy worker
on:
  workflow_call:
    inputs:
      automation_sha:
        type: string
        required: true
      source_sha:
        type: string
        required: true
      environment:
        type: string
        required: true
      node_version:
        type: string
        default: "24"
      lock_scope:
        type: string
        default: ""
    secrets:
      CLOUDFLARE_API_TOKEN:
        required: true
      IRIS_REFRESH_TOKEN:
        required: false
permissions:
  contents: read
  actions: read
jobs:
  deploy:
    uses: ./.github/workflows/deploy.yml
    with:
      automation_sha: ${{ inputs.automation_sha }}
      source_sha: ${{ inputs.source_sha }}
      environment: ${{ inputs.environment }}
      node_version: ${{ inputs.node_version }}
      lock_scope: ${{ inputs.lock_scope }}
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      IRIS_REFRESH_TOKEN: ${{ secrets.IRIS_REFRESH_TOKEN }}
