# Verifies pull requests without deployment jobs or credentials.
# The standalone Verify result preserves the existing required-check context.
name: Verify PR
on:
  pull_request:
permissions:
  contents: read
  actions: read
jobs:
  verify:
    name: PR checks
    uses: benhammoush/ci-cd-workflows/.github/workflows/verify-worker.yml@__AUTOMATION_SHA__
    with:
      automation_sha: "__AUTOMATION_SHA__"
      source_sha: ${{ github.sha }}
      environment: dev
      node_version: "__NODE_VERSION__"
  verify_result:
    name: Verify
    needs: verify
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Require successful PR checks
        run: test "$VERIFY_RESULT" = success
        env:
          VERIFY_RESULT: ${{ needs.verify.result }}
