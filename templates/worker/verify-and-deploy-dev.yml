# Verifies exact main revisions, then delivers the tested artifact to dev.
name: Verify and deploy to dev
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      sha:
        description: Exact merged source SHA to revalidate and redeploy in dev
        type: string
        required: true
permissions:
  contents: read
  actions: read
jobs:
  verify:
    name: Dev checks
    uses: benhammoush/ci-cd-workflows/.github/workflows/verify-worker.yml@__AUTOMATION_SHA__
    with:
      automation_sha: "__AUTOMATION_SHA__"
      source_sha: ${{ inputs.sha || github.sha }}
      environment: dev
      node_version: "__NODE_VERSION__"
  deploy_dev:
    name: Dev delivery
    needs: verify
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    uses: benhammoush/ci-cd-workflows/.github/workflows/deploy-worker.yml@__AUTOMATION_SHA__
    with:
      automation_sha: "__AUTOMATION_SHA__"
      source_sha: ${{ inputs.sha || github.sha }}
      environment: dev
      node_version: "__NODE_VERSION__"
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      IRIS_REFRESH_TOKEN: ${{ secrets.IRIS_REFRESH_TOKEN }}
