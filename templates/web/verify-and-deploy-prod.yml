# Manually verifies and releases an exact dev-accepted source revision to production.
# Calls shared CI/CD workflows with native environment approval.
name: Verify and deploy to prod
on:
  workflow_dispatch:
    inputs:
      sha:
        description: Exact merged source SHA already delivered and accepted in dev
        type: string
        required: true
permissions:
  contents: read
  actions: read
jobs:
  verify_release:
    name: Production checks
    uses: benhammoush/ci-cd-workflows/.github/workflows/verify-web.yml@__AUTOMATION_SHA__
    with:
      automation_sha: "__AUTOMATION_SHA__"
      source_sha: ${{ inputs.sha }}
      environment: production
      node_version: "__NODE_VERSION__"
  deploy_production:
    name: Production delivery
    needs: verify_release
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch'
    uses: benhammoush/ci-cd-workflows/.github/workflows/deploy-web.yml@__AUTOMATION_SHA__
    with:
      automation_sha: "__AUTOMATION_SHA__"
      source_sha: ${{ inputs.sha }}
      environment: production
      node_version: "__NODE_VERSION__"
    secrets:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      SMOKE_BYPASS: ${{ secrets.SMOKE_BYPASS }}
